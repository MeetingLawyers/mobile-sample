// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://maven.pkg.github.com/MeetingLawyers/android-sdk-chat/"
            credentials {
                // GitHub Packages requires credentials even for public consumers.
                // Ask credentials to support@meetinglawyers.com and set them in
                // ~/.gradle/gradle.properties or as environment variables.
                username = findProperty('GPR_USER') ?: System.getenv('GPR_USER') ?: ''
                password = findProperty('GPR_TOKEN') ?: System.getenv('GPR_TOKEN') ?: ''
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
