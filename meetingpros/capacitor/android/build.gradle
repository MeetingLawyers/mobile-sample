// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // MeetingDoctors SDKs (public)
        maven { url "https://storage.googleapis.com/production-mobile-sdks/android/" }
        // MeetingLawyers SDK (public)
        maven {
            url "https://sdk-download.meetinglawyers.com/android/maven/"
            content { includeGroup "com.meetinglawyers" }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
