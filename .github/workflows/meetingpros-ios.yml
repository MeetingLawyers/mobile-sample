name: MeetingPros iOS

on:
  push:
    branches: [main]
    paths: ['meetingpros/ios/**', '.github/workflows/meetingpros-ios.yml']
  pull_request:
    paths: ['meetingpros/ios/**', '.github/workflows/meetingpros-ios.yml']

permissions:
  contents: read

concurrency:
  group: meetingpros-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build
        working-directory: meetingpros/ios
        run: >
          xcodebuild build -project "MeetingPros Sample.xcodeproj" -scheme "MeetingPros Sample"
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
