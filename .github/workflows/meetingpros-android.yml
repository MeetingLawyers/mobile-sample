name: MeetingPros Android

on:
  push:
    branches: [main]
    paths: ['meetingpros/android/**', '.github/workflows/meetingpros-android.yml']
  pull_request:
    paths: ['meetingpros/android/**', '.github/workflows/meetingpros-android.yml']

permissions:
  contents: read

concurrency:
  group: meetingpros-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build
        working-directory: meetingpros/android
        run: ./gradlew assembleDebug
