name: MeetingPros Android

on:
  push:
    branches: [main]
    paths: ['meetingpros/android/**', '.github/workflows/meetingpros-android.yml']
  pull_request:
    paths: ['meetingpros/android/**', '.github/workflows/meetingpros-android.yml']

permissions:
  contents: read

concurrency:
  group: meetingpros-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The SDK is served from GitHub Packages; secrets are not available on pull requests from forks.
    env:
      GPR_USER: ${{ secrets.GPR_USER }}
      GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
    steps:
      - name: Check GitHub Packages credentials
        id: gpr
        run: |
          if [ -z "$GPR_TOKEN" ]; then
            echo "::notice::GPR_TOKEN is not available (pull request from a fork?): skipping the Android build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gpr.outputs.skip != 'true'
      - uses: actions/setup-java@v4
        if: steps.gpr.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        if: steps.gpr.outputs.skip != 'true'
      - name: Build
        if: steps.gpr.outputs.skip != 'true'
        working-directory: meetingpros/android
        run: ./gradlew assembleDebug
