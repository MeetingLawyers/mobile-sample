name: MeetingPros Capacitor

on:
  push:
    branches: [main]
    paths: ['meetingpros/capacitor/**', '.github/workflows/meetingpros-capacitor.yml']
  pull_request:
    paths: ['meetingpros/capacitor/**', '.github/workflows/meetingpros-capacitor.yml']

permissions:
  contents: read

concurrency:
  group: meetingpros-capacitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: meetingpros/capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meetingpros/capacitor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  android:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The SDK is served from GitHub Packages; secrets are not available on pull requests from forks.
    env:
      GPR_USER: ${{ secrets.GPR_USER }}
      GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
    steps:
      - name: Check GitHub Packages credentials
        id: gpr
        run: |
          if [ -z "$GPR_TOKEN" ]; then
            echo "::notice::GPR_TOKEN is not available (pull request from a fork?): skipping the Android build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gpr.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.gpr.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meetingpros/capacitor/package-lock.json
      - uses: actions/setup-java@v6
        if: steps.gpr.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        if: steps.gpr.outputs.skip != 'true'
      - name: Build
        if: steps.gpr.outputs.skip != 'true'
        working-directory: meetingpros/capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android
          (cd android && ./gradlew assembleDebug)

  ios:
    needs: web
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: meetingpros/capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meetingpros/capacitor/package-lock.json
      - name: Build
        run: |
          npm ci
          npm run build
          npx cap sync ios
          xcodebuild build -project ios/App/App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
