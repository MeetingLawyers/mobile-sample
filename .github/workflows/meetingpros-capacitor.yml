name: MeetingPros Capacitor

on:
  push:
    branches: [main]
    paths: ['meetingpros/capacitor/**', '.github/workflows/meetingpros-capacitor.yml']
  pull_request:
    paths: ['meetingpros/capacitor/**', '.github/workflows/meetingpros-capacitor.yml']

permissions:
  contents: read

concurrency:
  group: meetingpros-capacitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: meetingpros/capacitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meetingpros/capacitor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  android:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meetingpros/capacitor/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build
        working-directory: meetingpros/capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android
          (cd android && ./gradlew assembleDebug)

  ios:
    needs: web
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: meetingpros/capacitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meetingpros/capacitor/package-lock.json
      - name: Build
        run: |
          npm ci
          npm run build
          npx cap sync ios
          xcodebuild build -project ios/App/App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
