version: 2

# Public MeetingLawyers Android SDK repository, so Dependabot also proposes SDK bumps.
registries:
  meetinglawyers-maven:
    type: maven-repository
    url: https://sdk-download.meetinglawyers.com/android/maven/

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directories: ['/capacitor', '/meetingpros/capacitor']
    schedule:
      interval: monthly
    # Major versions (Ionic, React Router, TypeScript...) need a migration: update them by hand.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: pub
    directories: ['/flutter', '/meetingpros/flutter']
    schedule:
      interval: monthly

  - package-ecosystem: gradle
    directories: ['/android', '/capacitor/android', '/meetingpros/android', '/meetingpros/capacitor/android']
    registries: [meetinglawyers-maven]
    schedule:
      interval: monthly
    # The Firebase BoM must match the one the MeetingLawyers SDK is built against.
    ignore:
      - dependency-name: com.google.firebase:firebase-bom
    groups:
      gradle:
        patterns: ['*']
